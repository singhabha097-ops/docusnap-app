name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Extract zip and setup project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file detected!"
            exit 1
          fi
          echo "Processing $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_app

          SRC_DIR=$(find extracted_app -name "pubspec.yaml" -exec dirname {} \;)
          flutter create --org com.docusnap.compress temp_project
          cp -r "$SRC_DIR"/lib/* temp_project/lib/
          cp "$SRC_DIR"/pubspec.yaml temp_project/pubspec.yaml

          if [ -f "$SRC_DIR/android_config/AndroidManifest.xml" ]; then
            cp "$SRC_DIR/android_config/AndroidManifest.xml" temp_project/android/app/src/main/AndroidManifest.xml
          fi

          cd temp_project

          # Fix compileSdk and minSdk in app build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle* || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle* || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle* || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle* || true

          # Inject compileSdk 35 into all plugins (fixes 'gal' and older libraries)
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 35
                      }
                  }
              }
          }
          EOF

          flutter pub get

      - name: Build Ads-Only Release APK
        run: |
          cd temp_project
          flutter build apk --release --dart-define=ADS_ONLY=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
