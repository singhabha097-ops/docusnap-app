name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract zip and setup project
        run: |
          unzip docusnap_compress.zip
          flutter create --org com.docusnap.compress temp_project
          cp -r docusnap_compress/lib/* temp_project/lib/
          cp docusnap_compress/pubspec.yaml temp_project/pubspec.yaml
          cp docusnap_compress/android_config/AndroidManifest.xml temp_project/android/app/src/main/AndroidManifest.xml
          cd temp_project
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle* || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle* || true
          flutter pub get

      - name: Build Ads-Only Release APK
        run: |
          cd temp_project
          flutter build apk --release --dart-define=ADS_ONLY=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
